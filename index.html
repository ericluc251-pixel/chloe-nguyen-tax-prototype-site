n, if you have it","Bank account and routing number for a direct-deposit refund"]],["h","Income"],["ul",["W-2 from each job","1099-NEC, 1099-K or 1099-MISC for freelance and gig work","1099-INT and 1099-DIV for interest and dividends","1099-B for stock or crypto sales","1099-R for retirement withdrawals","1095-A if you bought health insurance on the Marketplace"]],["h","Deductions and credits"],["ul",["1098 for mortgage interest","1098-T for college tuition","Childcare provider name, address and tax ID","Records of charitable donations"]],["h","Self-employed and business"],["ul",["Profit and loss report or bookkeeping file","Business bank and card statements","Mileage log","Payroll reports if you have employees","K-1s from partnerships or S-corps you own"]]]},vi:{t:"Cần mang gì khi khai thuế",sum:"Danh sách cho cá nhân, người tự kinh doanh và doanh nghiệp.",body:[["p","Sau khi hoàn tất bảng câu hỏi trực tuyến, bạn sẽ có danh sách giấy tờ riêng. Đây là những thứ đa số mọi người cần."],["h","Tất cả mọi người"],["ul",["Giấy tờ tùy thân có ảnh của bạn (và vợ/chồng nếu khai chung)","Số An sinh Xã hội hoặc ITIN của mọi người trên tờ khai","Tờ khai năm ngoái, nếu có","Số tài khoản và số routing ngân hàng để nhận hoàn thuế"]],["h","Thu nhập"],["ul",["W-2 từ mỗi nơi làm việc","1099-NEC, 1099-K hoặc 1099-MISC cho việc làm tự do và gig","1099-INT và 1099-DIV cho tiền lãi và cổ tức","1099-B khi bán cổ phiếu hoặc tiền mã hóa","1099-R khi rút tiền hưu trí","1095-A nếu mua bảo hiểm sức khỏe qua Marketplace"]],["h","Khấu trừ và tín thuế"],["ul",["1098 cho lãi vay mua nhà","1098-T cho học phí đại học","Tên, địa chỉ và mã số thuế của nơi giữ trẻ","Biên nhận quyên góp từ thiện"]],["h","Tự kinh doanh và doanh nghiệp"],["ul",["Báo cáo lời lỗ hoặc sổ sách","Sao kê ngân hàng và thẻ của doanh nghiệp","Sổ ghi số dặm","Báo cáo lương nếu có nhân viên","K-1 từ công ty hợp danh hoặc S-corp bạn sở hữu"]]]}},{slug:"key-deadlines",cat:"dates",en:{t:"Key tax deadlines for 2026–2027",sum:"Federal dates for individuals, businesses and estimated payments.",body:[["p","These are the main federal dates for the 2026 tax year. When a date falls on a weekend, it moves to the next business day."],["table",[["Date","What is due"],["Oct 15, 2026","Extended 2025 individual (1040) and C-corp (1120) returns"],["Jan 15, 2027","4th-quarter 2026 estimated tax payment"],["Feb 1, 2027","W-2s and 1099-NECs to workers and the government (Jan 31 is a Sunday)"],["Mar 15, 2027","2026 partnership (1065) and S-corp (1120-S) returns, or extension"],["Apr 15, 2027","2026 individual and C-corp returns, or extension; 1st-quarter 2027 estimate"],["May 17, 2027","Texas franchise tax report (May 15 is a Saturday)"],["Jun 15, 2027","2nd-quarter 2027 estimated tax payment"],["Sep 15, 2027","Extended partnership and S-corp returns; 3rd-quarter estimate"],["Oct 15, 2027","Extended 2026 individual and C-corp returns"]]],["p","The IRS sometimes extends deadlines for areas hit by disasters. We check this for every client."]]},vi:{t:"Các hạn chót thuế quan trọng 2026–2027",sum:"Ngày liên bang cho cá nhân, doanh nghiệp và thuế ước tính.",body:[["p","Đây là các ngày chính của liên bang cho năm thuế 2026. Nếu rơi vào cuối tuần, hạn chót dời sang ngày làm việc kế tiếp."],["table",[["Ngày","Cần nộp"],["15/10/2026","Tờ khai cá nhân (1040) và C-corp (1120) năm 2025 đã gia hạn"],["15/01/2027","Thuế ước tính quý 4 năm 2026"],["01/02/2027","W-2 và 1099-NEC gửi người lao động và chính phủ (31/1 là Chủ nhật)"],["15/03/2027","Tờ khai công ty hợp danh (1065) và S-corp (1120-S) năm 2026, hoặc xin gia hạn"],["15/04/2027","Tờ khai cá nhân và C-corp năm 2026, hoặc xin gia hạn; thuế ước tính quý 1 năm 2027"],["17/05/2027","Báo cáo thuế nhượng quyền Texas (15/5 là thứ Bảy)"],["15/06/2027","Thuế ước tính quý 2 năm 2027"],["15/09/2027","Tờ khai hợp danh và S-corp đã gia hạn; thuế ước tính quý 3"],["15/10/2027","Tờ khai cá nhân và C-corp năm 2026 đã gia hạn"]]],["p","IRS đôi khi gia hạn cho vùng bị thiên tai. Chúng tôi kiểm tra điều này cho mọi khách hàng."]]}},{slug:"extensions",cat:"dates",en:{t:"Extensions: more time to file, not to pay",sum:"What an extension does, and what it does not.",body:[["p","An individual extension (Form 4868) moves your filing deadline from April 15 to October 15. It does not move the payment deadline."],["ul",["Any tax you owe is still due by April 15.","Unpaid tax collects interest and a late-payment penalty until it is paid.","If you are owed a refund, there is generally no penalty for filing late, but you only have three years to claim it."]],["p","If you cannot pay in full, file anyway. The penalty for not filing is much larger than the penalty for not paying, and the IRS offers payment plans."]]},vi:{t:"Gia hạn: thêm thời gian khai, không phải thêm thời gian trả",sum:"Gia hạn giúp được gì và không giúp được gì.",body:[["p","Gia hạn cho cá nhân (Mẫu 4868) dời hạn khai từ 15/4 sang 15/10. Gia hạn không dời hạn trả tiền thuế."],["ul",["Tiền thuế còn nợ vẫn phải trả trước 15/4.","Tiền thuế chưa trả sẽ bị tính lãi và phạt trả trễ cho đến khi trả xong.","Nếu bạn được hoàn thuế, thông thường không bị phạt khi khai trễ, nhưng bạn chỉ có ba năm để nhận."]],["p","Nếu không trả đủ được, hãy cứ khai. Tiền phạt không khai lớn hơn nhiều so với tiền phạt không trả, và IRS có chương trình trả góp."]]}},{slug:"refund-timing",cat:"money",en:{t:"When will I get my refund?",sum:"Typical timing and how to check your refund status.",body:[["p","The IRS issues most refunds for e-filed returns with direct deposit in less than 21 days."],["ul",["Check status with the IRS “Where’s My Refund?” tool at irs.gov/refunds, starting about 24 hours after your e-filed return is accepted.","By law, refunds that include the Earned Income Tax Credit or the Additional Child Tax Credit cannot be issued before mid-February.","Paper returns take longer. Amended returns can take 16 weeks or more."]],["p","Your portal shows the moment the IRS accepts your return."]]},vi:{t:"Khi nào tôi nhận được tiền hoàn thuế?",sum:"Thời gian thường gặp và cách kiểm tra.",body:[["p","IRS gửi phần lớn tiền hoàn thuế của tờ khai nộp điện tử, nhận qua tài khoản ngân hàng, trong vòng chưa tới 21 ngày."],["ul",["Kiểm tra bằng công cụ “Where’s My Refund?” của IRS tại irs.gov/refunds, khoảng 24 giờ sau khi tờ khai điện tử được chấp nhận.","Theo luật, tiền hoàn thuế có tín thuế EITC hoặc Additional Child Tax Credit không được gửi trước giữa tháng 2.","Tờ khai giấy lâu hơn. Tờ khai điều chỉnh có thể mất 16 tuần hoặc hơn."]],["p","Cổng thông tin của bạn sẽ cập nhật ngay khi IRS chấp nhận tờ khai."]]}},{slug:"irs-letters",cat:"irs",en:{t:"I got a letter from the IRS. What now?",sum:"How to read it, what to watch for, and how we help.",body:[["p","Do not ignore it. Most IRS letters ask for a response by a specific date."],["ul",["Find the notice number (it starts with CP or LTR) in the top or bottom right corner.","Read what the IRS thinks changed and how much it says you owe or are owed.","Photograph every page and upload it to your portal. We will explain it and tell you what to do."]],["h","Watch out for scams"],["ul",["The IRS usually contacts you first by mail.","The IRS does not demand payment by gift card, cryptocurrency or wire transfer.","The IRS does not threaten arrest over the phone or by text."]]]},vi:{t:"Tôi nhận được thư từ IRS. Phải làm gì?",sum:"Cách đọc thư, điều cần cảnh giác và cách chúng tôi giúp.",body:[["p","Đừng bỏ qua. Phần lớn thư IRS yêu cầu trả lời trước một ngày cụ thể."],["ul",["Tìm số thư (bắt đầu bằng CP hoặc LTR) ở góc trên hoặc dưới bên phải.","Đọc xem IRS cho rằng điều gì thay đổi và số tiền bạn nợ hoặc được hoàn.","Chụp mọi trang và tải lên cổng thông tin. Chúng tôi sẽ giải thích và hướng dẫn bạn."]],["h","Cẩn thận lừa đảo"],["ul",["IRS thường liên lạc với bạn trước tiên bằng thư.","IRS không đòi trả tiền bằng thẻ quà tặng, tiền mã hóa hay chuyển khoản wire.","IRS không đe dọa bắt giữ qua điện thoại hay tin nhắn."]]]}},{slug:"self-employed",cat:"biz",en:{t:"Self-employed? The basics",sum:"Self-employment tax, records to keep and quarterly payments.",body:[["p","If your net earnings from self-employment are $400 or more, you owe self-employment tax (15.3% for Social Security and Medicare) on top of income tax."],["ul",["Keep every 1099-NEC and 1099-K, but report all income even without a form.","Keep receipts for supplies, phone, software and other business costs.","Keep a mileage log: date, where, why, and miles.","Use a separate bank account for the business."]],["h","Quarterly estimated payments"],["p","No employer withholds tax for you, so you usually pay four times a year: April 15, June 15, September 15 and January 15. We can set these up for you."]]},vi:{t:"Tự kinh doanh? Những điều cơ bản",sum:"Thuế tự kinh doanh, hồ sơ cần giữ và thuế ước tính hàng quý.",body:[["p","Nếu thu nhập ròng từ tự kinh doanh từ $400 trở lên, bạn phải trả thuế tự kinh doanh (15.3% cho An sinh Xã hội và Medicare) ngoài thuế thu nhập."],["ul",["Giữ mọi 1099-NEC và 1099-K, nhưng khai tất cả thu nhập kể cả khi không có mẫu.","Giữ biên nhận vật tư, điện thoại, phần mềm và các chi phí kinh doanh khác.","Ghi sổ số dặm: ngày, nơi đến, lý do và số dặm.","Dùng tài khoản ngân hàng riêng cho việc kinh doanh."]],["h","Thuế ước tính hàng quý"],["p","Không có chủ nào khấu trừ thuế cho bạn, nên thường bạn trả bốn lần mỗi năm: 15/4, 15/6, 15/9 và 15/1. Chúng tôi có thể thiết lập giúp bạn."]]}},{slug:"texas-taxes",cat:"biz",en:{t:"Texas taxes: what applies to you",sum:"No state income tax for people; franchise tax for many businesses.",body:[["p","Texas has no personal income tax, so most Texas residents file only a federal return. If you lived or worked in another state during the year, you may need that state’s return."],["h","Businesses"],["ul",["LLCs and corporations are generally subject to the Texas franchise tax. Sole proprietors are not.","The annual report is due May 15 (the next business day if that is a weekend).","Businesses below the no-tax-due threshold generally owe nothing but still file an information report each year."]]]},vi:{t:"Thuế Texas: điều gì áp dụng cho bạn",sum:"Không có thuế thu nhập cá nhân; thuế nhượng quyền cho nhiều doanh nghiệp.",body:[["p","Texas không có thuế thu nhập cá nhân, nên đa số cư dân Texas chỉ khai liên bang. Nếu trong năm bạn sống hoặc làm việc ở tiểu bang khác, có thể bạn cần khai cho tiểu bang đó."],["h","Doanh nghiệp"],["ul",["LLC và công ty thường phải chịu thuế nhượng quyền Texas. Chủ duy nhất (sole proprietor) thì không.","Báo cáo hàng năm hạn chót 15/5 (dời sang ngày làm việc kế tiếp nếu rơi vào cuối tuần).","Doanh nghiệp dưới ngưỡng không phải nộp thuế thường không nợ gì nhưng vẫn phải nộp báo cáo thông tin mỗi năm."]]]}},{slug:"security",cat:"safe",en:{t:"How we protect your information",sum:"Our security practices and steps you can take.",body:[["p","Tax professionals must follow IRS and FTC data-security rules. We keep a written security plan and follow it."],["ul",["Your documents are stored encrypted.","Signing in requires a second step (multi-factor authentication).","Only the people working on your return can see it.","We will never ask for your password by text or email."]],["h","Protect yourself"],["p","Any taxpayer can get an Identity Protection PIN from the IRS at irs.gov/ippin. It stops anyone else from filing a return with your Social Security number."]]},vi:{t:"Chúng tôi bảo vệ thông tin của bạn như thế nào",sum:"Cách chúng tôi bảo mật và điều bạn có thể làm.",body:[["p","Người khai thuế phải tuân theo quy định bảo mật dữ liệu của IRS và FTC. Chúng tôi có kế hoạch bảo mật bằng văn bản và làm đúng theo đó."],["ul",["Giấy tờ của bạn được lưu trữ mã hóa.","Đăng nhập cần thêm một bước xác minh (xác thực nhiều lớp).","Chỉ người làm tờ khai của bạn mới được xem.","Chúng tôi không bao giờ hỏi mật khẩu của bạn qua tin nhắn hay email."]],["h","Tự bảo vệ mình"],["p","Bất kỳ người đóng thuế nào cũng có thể xin mã Identity Protection PIN từ IRS
